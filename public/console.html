<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知华车载终端运营中心</title><link rel="stylesheet" href="/styles.css"></head><body><div class="layout"><aside class="side"><div class="logo">ZHUATECH MOBILITY<small>上海如静知华信息科技有限公司</small></div><div class="nav"><div class="on">运营态势</div><div>车辆与司机</div><div>车载终端</div><div>行程任务</div><div>实时轨迹</div><div>安全告警</div><div>指令中心</div></div></aside><main class="main"><header class="head"><div><h1>车载作业运营中心</h1><div class="sub">上海城配中心 · 车辆、任务与安全实时监控</div></div><div class="status">● 终端链路正常</div></header><section class="metrics" id="metrics"></section><section class="cols"><div class="card"><h2>车辆与任务</h2><div id="vehicles"></div></div><div class="card"><h2>实时安全告警</h2><div id="alerts"></div></div></section></main></div><script>fetch('/api/dashboard',{headers:{'x-api-key':'zhuatech-demo-key'}}).then(r=>r.json()).then(d=>{const L={vehicles:'车辆总数',onlineTerminals:'在线终端',activeTrips:'执行中',readyTrips:'待发车',openAlerts:'未处理告警',openIncidents:'开放事件'};metrics.innerHTML=Object.entries(d.metrics).map(([k,v])=>`<div class="metric"><span>${L[k]}</span><b>${v}</b></div>`).join('');vehicles.innerHTML=d.vehicles.map(v=>{const trip=d.trips.find(t=>t.vehicleId===v.id);return`<div class="vehicle"><span class="plate">${v.plate}</span><div><b>${v.type}</b><br><small>${trip?trip.tripNo+' · '+trip.status:'暂无任务'}</small></div><span>${v.status}</span></div>`}).join('');alerts.innerHTML=d.alerts.filter(a=>a.status==='open').map(a=>`<div class="alert"><b>${a.type}</b><small>${a.message} · ${a.severity}</small></div>`).join('')||'<div class="sub">暂无安全告警</div>'});</script></body></html>
